);if(!g){g=doc.createElement('div');g.className='grid';s.appendChild(g);}return g;}function insertBeforeFooter(doc,s){var f=doc.querySelector('.footer,footer');if(f&&f.parentNode)f.parentNode.insertBefore(s,f);else doc.body.appendChild(s);}function addNavLink(doc,id,label){var n=doc.querySelector('.nav');if(!n||n.querySelector('a[href="#'+id+'"]'))return;var a=doc.createElement('a');a.href='#'+id;a.textContent=label;n.appendChild(a);}function ensureSection(doc,words,id,title,nav){var s=findSection(doc,words);if(!s){s=doc.createElement('section');s.className='section gold';s.id=id;s.innerHTML='<h2>'+title+'</h2><div class="grid"></div>';insertBeforeFooter(doc,s);}if(!s.id)s.id=id;addNavLink(doc,s.id,nav);return s;}function add(doc,s,id,e,t,sub,ing,m,img){if(!doc.getElementById(id))gridFor(doc,s).appendChild(makeCard(doc,id,e,t,sub,ing,m,img));}function inject(){var frame=document.getElementById('buikboek-frame'),doc;try{doc=frame.contentDocument||frame.contentWindow.document;}catch(e){return false;}if(!doc||!doc.body)return false;var sauces=ensureSection(doc,['sausjes & dips','sauzen & dips','sausjes','sauzen','dips'],'sausjes-en-dips','SAUSJES & DIPS','Sausjes & Dips');add(doc,sauces,'sticky-korean-honey-chili-saus','🍯🌶️','Sticky Korean Honey Chili Saus','Pittig zoet • honingachtig • zonder koken',['3 el honing','1 el gochujang','1 el sweet chilisaus','1 tl sojasaus','1 tl rijstazijn of natuurazijn','Klein scheutje sesamolie, optioneel','Snufje MSG, optioneel'],'Meng alles koud tot een gladde, kleverige saus. Lekker over hete krokante kip of als dip. Meer honing maakt hem zoeter, meer gochujang pittiger en meer azijn frisser.','images/sticky-korean-honey-chili-ai.svg?v=1');add(doc,sauces,'romige-paddenstoelensaus','🍄','Romige Paddenstoelensaus','Diep hartig • romig • vol umami',['Champignons of gemengde paddenstoelen','Boter','Ui','Knoflook','Kookroom','Tijm','Zwarte peper','Parmezaan, optioneel'],'Bak de paddenstoelen goed donkerbruin in boter. Voeg ui, knoflook en tijm toe. Schenk kookroom erbij en laat kort indikken. Pureer glad met de staafmixer en maak af met zwarte peper en eventueel Parmezaan.','images/romige-paddenstoelensaus-ai.svg?v=1');add(doc,sauces,'romige-broccolisaus','🥦','Romige Broccolisaus','Zacht • romig • fris',['Broccoli','Knoflook','Boter','Kookroom','Parmezaan','Zwarte peper','Klein kneepje citroen'],'Kook de broccoli zacht. Bak knoflook kort in boter, voeg broccoli en kookroom toe en pureer glad. Maak af met Parmezaan, zwarte peper en een klein kneepje citroen.','images/romige-broccolisaus-ai.svg?v=1');add(doc,sauces,'geroosterde-tomaat-paprikasaus','🍅🫑','Geroosterde Tomaat-Paprikasaus','Zoet • geroosterd • romig',['Tomaten','Paprika','Ui','Knoflook','Kookroom'],'Rooster tomaat, paprika, ui en knoflook tot ze zacht en mooi gekleurd zijn. Doe alles in een pan met een beetje kookroom en pureer glad met de staafmixer.','images/tomaat-paprikasaus-ai.svg?v=1');add(doc,sauces,'romige-wortel-knoflooksaus','🥕','Wortel-Knoflooksaus','Licht zoet • romig • kruidig',['Wortel','Ui','Knoflook','Kookroom','Gerookt paprikapoeder'],'Kook of rooster de wortel zacht. Bak ui en knoflook, voeg de wortel en kookroom toe en pureer glad. Breng op smaak met gerookt paprikapoeder.','images/wortel-knoflooksaus-ai.svg?v=1');add(doc,sauces,'romige-courgettesaus','🥒','Romige Courgettesaus','Zacht • fris • romig',['Courgette','Boter','Ui','Knoflook','Kookroom','Basilicum','Parmezaan','Zwarte peper'],'Bak courgette flink in boter met ui en knoflook. Voeg kookroom toe en pureer glad. Maak af met basilicum, Parmezaan en zwarte peper.','images/romige-courgettesaus-ai.svg?v=1');add(doc,sauces,'geroosterde-ui-knoflooksaus','🧅🧄','Geroosterde Ui-Knoflooksaus','Zoet • hartig • krachtig',['Ui','Knoflook','Boter','Kookroom','Klein beetje Dijonmosterd'],'Bak de ui langzaam in boter tot hij diep goudbruin en zoet is. Voeg geroosterde knoflook en kookroom toe, pureer glad en maak af met een klein beetje Dijonmosterd.','images/ui-knoflooksaus-ai.svg?v=1');add(doc,sauces,'romige-maissaus','🌽','Romige Maïssaus','Zoet • rokerig • romig',['Maïs','Boter','Knoflook','Kookroom','Gerookt paprikapoeder'],'Bak de maïs stevig in boter tot hij hier en daar bruin wordt. Voeg knoflook en kookroom toe, breng op smaak met gerookt paprikapoeder en pureer glad.','images/romige-maissaus-ai.svg?v=1');add(doc,sauces,'romige-pompoensaus','🎃','Romige Pompoensaus','Vol • zacht • kruidig',['Pompoen','Knoflook','Kookroom','Tijm of rozemarijn','Parmezaan'],'Rooster de pompoen en knoflook tot ze zacht zijn. Voeg kookroom toe en pureer glad. Maak af met tijm of rozemarijn en Parmezaan.','images/romige-pompoensaus-ai.svg?v=1');var sides=ensureSection(doc,['bijgerechten'],'bijgerechten','BIJGERECHTEN','Bijgerechten');add(doc,sides,'crostini-di-fegatini','🇮🇹🍞','Crostini di Fegatini','Toscaanse kippenleverpaté • licht korrelig • voor op brood',['500 g kippenlevers','1 ui, fijgesneden','2 tenen knoflook, fijngehakt','3 el olijfolie','50 g boter','100 ml droge witte wijn','5–6 salieblaadjes','2 ansjovisfilets','1 el kappertjes','Zout en zwarte peper'],'Bak de ui 8–10 minuten zacht in olijfolie. Voeg knoflook, salie, ansjovis en kappertjes toe. Bak de kippenlevers 4–5 minuten mee, blus af met witte wijn en laat bijna volledig inkoken. Voeg de boter toe en pulseer kort, zodat de paté bewust licht grof en korrelig blijft. Laat minimaal 2 uur koelen en serveer op geroosterd brood.','https://image.pollinations.ai/prompt/rustic%20Italian%20crostini%20di%20fegatini%20Tuscan%20chicken%20liver%20pate%20on%20toasted%20baguette%20wooden%20board%20warm%20natural%20light%20realistic%20food%20photography%20no%20text?width=640&height=568&seed=18473&nologo=true');add(doc,sides,'romige-bundelzwammen-bosui-ketjap','🍄🌿','Romige Bundelzwammen met Bosui & Ketjap','Romig • hartig • licht zoetzuur • lekker met vers brood',['Bundelzwammen','Klontje roomboter','Beetje melk','Scheutje kookroom','Klein beetje sojasaus','Klein beetje ketjap manis','Paprikapoeder','Knoflookpoeder','Rozemarijn','Snufje MSG','Zwarte peper','Bosui, fijngesneden','Klein scheutje azijn','Zwarte sesamzaadjes','Vers brood van de bakker en roomboter, om erbij te serveren'],'Smelt een klontje boter op laag vuur en bak de bundelzwammen rustig. Voeg een beetje melk en een scheutje kookroom toe. Breng op smaak met sojasaus, ketjap, paprikapoeder, knoflookpoeder, rozemarijn, MSG en zwarte peper. Laat zachtjes indikken en schep het grootste gedeelte in een kom. Bak de bosui enkele minuten in de resten van de pan met een klein scheutje azijn. Verdeel dit over de romige bundelzwammen en werk af met zwarte sesamzaadjes. Serveer met vers bakkersbrood en roomboter.','https://image.pollinations.ai/prompt/creamy%20Asian%20fusion%20cluster%20mushrooms%20in%20a%20small%20rustic%20bowl%20topped%20with%20sauteed%20spring%20onion%20and%20black%20sesame%20seeds%20fresh%20artisan%20bread%20and%20butter%20beside%20it%20warm%20cozy%20restaurant%20lighting%20highly%20realistic%20food%20photography%20no%20text?width=640&height=568&seed=39172&nologo=true');var tea=ensureSection(doc,['theetjes','thee'],'theetjes','THEETJES','Theetjes');add(doc,tea,'citroen-kurkuma-chia-thee','🍋☕','Citroen-Kurkuma-Chia Thee','Warm • kruidig • fris',['1 citroen','Water','1 theelepel chiapoeder','1 theelepel kurkuma','Klein beetje zwarte peper'],'Doe de citroen in het water. Voeg chiapoeder, kurkuma en een klein beetje zwarte peper toe. Laat 10 minuten zacht koken. Zeef de thee daarna en serveer warm.','images/citroen-kurkuma-chia-thee-ai.svg?v=1');return !!doc.getElementById('citroen-kurkuma-chia-thee')&&!!doc.getElementById('romige-paddenstoelensaus');}var tries=0;var timer=setInterval(function(){tries++;if(inject()||tries>40)clearInterval(timer);},250);document.getElementById('buikboek-frame').addEventListener('load',function(){inject();setTimeout(inject,500);setTimeout(inject,1500);});window.addEventListener('pageshow',inject);})();</script></body></html>
